[project]
name = "reasoning-kits"
version = "0.1.0"
description = "A lightweight standard for self-improving LLM reasoning workflows."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Simon Weigold"},
]
keywords = ["llm", "ai", "workflow", "reasoning", "agents", "kits"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "litellm>=1.50.0",
    "python-dotenv>=1.2.1",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "mcp>=1.26.0",
    "pypdf>=5.1.0",
    "openpyxl>=3.1.5",
    "python-docx>=1.1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pre-commit>=4.6.0",
]

[project.scripts]
rk = "reasoning_kits.cli:main"

[project.urls]
Homepage = "https://reasoningkits.io"
Documentation = "https://reasoningkits.io/docs"
Repository = "https://github.com/simonweigold/reasoning-kits"
Issues = "https://github.com/simonweigold/reasoning-kits/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reasoning_kits"]
exclude = [
    "**/tests/",
    "**/test_*.py",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/reasoning_kits"]
branch = true

[tool.coverage.report]
fail_under = 0
show_missing = true

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
warn_return_any = false
warn_unused_ignores = true
no_implicit_reexport = false